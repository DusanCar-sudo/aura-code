[package]
name = "aura-code-app"
version = "0.17.0"
description = "Aura Code — Autonomous AI Coding Agent Desktop Application"
authors = ["Dusan Car <dusan@aura-code.dev>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
